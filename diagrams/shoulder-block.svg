<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect width="820" height="500" fill="#f6f7f9"/>

  <!-- ===== 공통: 코트 그리기 함수 대신 두 번 복사 ===== -->
  <!-- 왼쪽 패널 -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="380" height="460" rx="12" fill="#ffffff" stroke="#dde1e6"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#2b8a3e">O  올라가는 쪽 어깨 차단</text>

    <!-- 코트 -->
    <line x1="40" y1="52" x2="340" y2="52" stroke="#b9bfc7" stroke-width="2"/>
    <rect x="150" y="52" width="80" height="120" fill="none" stroke="#b9bfc7" stroke-width="2"/>
    <line x1="170" y1="58" x2="210" y2="58" stroke="#495057" stroke-width="4"/>
    <circle cx="190" cy="76" r="9" fill="none" stroke="#e8590c" stroke-width="3"/>
    <text x="190" y="46" text-anchor="middle" font-size="11" fill="#868e96">골대 (화면 위)</text>
    <path d="M40,52 L40,84 A150,150 0 0,0 340,84 L340,52" fill="none" stroke="#b9bfc7" stroke-width="2"/>
    <text x="300" y="250" font-size="11" fill="#868e96">3점 라인</text>

    <!-- 목표: 왼쪽 45도 자리 -->
    <circle cx="84" cy="182" r="14" fill="none" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="84" y="214" text-anchor="middle" font-size="11" fill="#2b8a3e">슈가가 가고 싶은</text>
    <text x="84" y="228" text-anchor="middle" font-size="11" fill="#2b8a3e">왼쪽 45도 자리</text>

    <!-- 슈가 -->
    <g transform="translate(175,300)">
      <circle r="18" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#d9480f">슈</text>
      <!-- 어깨 두 개 -->
      <circle cx="-16" cy="-12" r="5" fill="#e8590c"/>
      <circle cx="16" cy="-12" r="5" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
    </g>
    <text x="222" y="295" font-size="11" fill="#d9480f">← 왼쪽 어깨 =</text>
    <text x="222" y="309" font-size="11" fill="#d9480f">올라가는 쪽</text>

    <!-- 가려던 길 (점선) -->
    <path d="M160,288 L100,200" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.5"/>

    <!-- 수비 -->
    <g transform="translate(138,262)">
      <circle r="18" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#1864ab">수</text>
    </g>
    <!-- 접촉 표시 -->
    <circle cx="158" cy="287" r="9" fill="none" stroke="#c92a2a" stroke-width="2.5"/>
    <text x="60" y="262" font-size="12" font-weight="700" fill="#1864ab">페업으로</text>
    <text x="60" y="277" font-size="12" font-weight="700" fill="#1864ab">어깨만 툭</text>

    <!-- 결과: 중앙으로 내려옴 -->
    <path d="M190,322 Q215,350 240,360" stroke="#d9480f" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
    <text x="246" y="380" font-size="12" font-weight="700" fill="#d9480f">위로 못 가고</text>
    <text x="246" y="395" font-size="12" font-weight="700" fill="#d9480f">중앙으로 내려옴</text>

    <!-- 설명 -->
    <rect x="16" y="412" width="348" height="36" rx="6" fill="#ebfbee"/>
    <text x="190" y="427" text-anchor="middle" font-size="11.5" fill="#2b8a3e">수비가 슈가보다 반 칸 위·45도 쪽에 서서 가는 길을 몸으로 막음</text>
    <text x="190" y="441" text-anchor="middle" font-size="11.5" fill="#2b8a3e">중앙 슛은 성공률 낮고, 노골 나면 상대 센터가 못 잡는 자리</text>
  </g>

  <!-- 오른쪽 패널 -->
  <g transform="translate(420,20)">
    <rect x="0" y="0" width="380" height="460" rx="12" fill="#ffffff" stroke="#dde1e6"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#c92a2a">X  옆구리 차단</text>

    <!-- 코트 -->
    <line x1="40" y1="52" x2="340" y2="52" stroke="#b9bfc7" stroke-width="2"/>
    <rect x="150" y="52" width="80" height="120" fill="none" stroke="#b9bfc7" stroke-width="2"/>
    <line x1="170" y1="58" x2="210" y2="58" stroke="#495057" stroke-width="4"/>
    <circle cx="190" cy="76" r="9" fill="none" stroke="#e8590c" stroke-width="3"/>
    <text x="190" y="46" text-anchor="middle" font-size="11" fill="#868e96">골대 (화면 위)</text>
    <path d="M40,52 L40,84 A150,150 0 0,0 340,84 L340,52" fill="none" stroke="#b9bfc7" stroke-width="2"/>

    <!-- 목표 자리 -->
    <circle cx="84" cy="182" r="14" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 슈가 -->
    <g transform="translate(175,300)">
      <circle r="18" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#d9480f">슈</text>
      <circle cx="-16" cy="-12" r="5" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
      <circle cx="16" cy="-12" r="5" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
    </g>

    <!-- 수비: 같은 높이 옆 -->
    <g transform="translate(128,300)">
      <circle r="18" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#1864ab">수</text>
    </g>
    <text x="60" y="340" font-size="12" font-weight="700" fill="#1864ab">같은 높이에서</text>
    <text x="60" y="355" font-size="12" font-weight="700" fill="#1864ab">옆구리에 붙음</text>

    <!-- 위로 가는 길 열림 -->
    <path d="M165,282 L96,198" stroke="#c92a2a" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
    <text x="150" y="235" font-size="12" font-weight="700" fill="#c92a2a">위로 가는 길이</text>
    <text x="150" y="250" font-size="12" font-weight="700" fill="#c92a2a">그대로 열려 있음</text>

    <!-- 골대 일직선에서 벗어남 -->
    <line x1="175" y1="282" x2="190" y2="92" stroke="#868e96" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="200" y="200" font-size="11" fill="#868e96">골대–슈가 일직선</text>
    <text x="200" y="214" font-size="11" fill="#868e96">(수비가 여기서 벗어남)</text>

    <!-- 설명 -->
    <rect x="16" y="412" width="348" height="36" rx="6" fill="#fff5f5"/>
    <text x="190" y="427" text-anchor="middle" font-size="11.5" fill="#c92a2a">슈가는 그냥 올라가서 45도에서 드리블을 치고,</text>
    <text x="190" y="441" text-anchor="middle" font-size="11.5" fill="#c92a2a">수비는 일직선에서 벗어나 있어 드리블에 다리가 풀림</text>
  </g>
</svg>
