<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
    <symbol id="court" viewBox="0 0 400 230">
      <line x1="40" y1="48" x2="360" y2="48" stroke="#c3c9d1" stroke-width="2"/>
      <rect x="160" y="48" width="80" height="100" fill="none" stroke="#c3c9d1" stroke-width="2"/>
      <line x1="182" y1="54" x2="218" y2="54" stroke="#495057" stroke-width="4"/>
      <circle cx="200" cy="70" r="8" fill="none" stroke="#e8590c" stroke-width="3"/>
      <path d="M40,48 L40,76 A160,160 0 0,0 360,76 L360,48" fill="none" stroke="#c3c9d1" stroke-width="2"/>
    </symbol>
  </defs>
  <rect width="860" height="660" fill="#f6f7f9"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#1a1d22">포가의 슈가 수비 · 4단계</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#868e96">골대는 화면 위 · 주황 = 슈가 · 파랑 = 나(포가) · 왼쪽 45도로 올라가려는 슈가 기준</text>

  <!-- ① 길목 먼저 -->
  <g transform="translate(20,64)">
    <rect width="400" height="270" rx="12" fill="#fff" stroke="#dde1e6"/>
    <text x="14" y="26" font-size="15" font-weight="900" fill="#2b8a3e">① 길목 먼저 (어깨 차단)</text>
    <use href="#court" x="0" y="30" width="400" height="230"/>
    <circle cx="95" cy="150" r="13" fill="none" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="95" y="182" text-anchor="middle" font-size="10.5" fill="#2b8a3e">슈가가 가고 싶은 45도</text>
    <path d="M178,232 L112,166" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="5 4" opacity="0.45"/>
    <g transform="translate(150,200)"><circle r="16" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#1864ab">수</text></g>
    <g transform="translate(192,242)"><circle r="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#d9480f">슈</text><circle cx="-14" cy="-10" r="4.5" fill="#e8590c"/></g>
    <path d="M208,255 Q240,270 268,268" stroke="#d9480f" stroke-width="3" fill="none" marker-end="url(#aO)"/>
    <text x="236" y="212" font-size="11.5" font-weight="700" fill="#1864ab">반 칸 위·45도 쪽에</text>
    <text x="236" y="226" font-size="11.5" font-weight="700" fill="#1864ab">먼저 서서 어깨만 툭</text>
    <text x="276" y="286" font-size="11.5" font-weight="700" fill="#d9480f">중앙으로 내려옴</text>
    <text x="14" y="262" font-size="11" fill="#495057">공 받기 전에 가 있을 것 · 옆구리는 금지</text>
  </g>

  <!-- ② 패스 순간 밀기 -->
  <g transform="translate(440,64)">
    <rect width="400" height="270" rx="12" fill="#fff" stroke="#dde1e6"/>
    <text x="14" y="26" font-size="15" font-weight="900" fill="#1971c2">② 패스 날아오는 순간 밀기 (꺽기 차단)</text>
    <use href="#court" x="0" y="30" width="400" height="230"/>
    <g transform="translate(70,245)"><circle r="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="900" fill="#e67700">상포</text></g>
    <circle cx="88" cy="232" r="5" fill="#495057"/>
    <path d="M100,228 L238,214" stroke="#e67700" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#aO)"/>
    <text x="150" y="208" font-size="10.5" fill="#e67700">패스 (이 순간이 꺽 타이밍)</text>
    <g transform="translate(262,210)"><circle r="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#d9480f">슈</text></g>
    <g transform="translate(262,166)"><circle r="16" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#1864ab">수</text></g>
    <path d="M262,184 L262,196" stroke="#1971c2" stroke-width="4" marker-end="url(#aB)"/>
    <text x="286" y="172" font-size="11.5" font-weight="700" fill="#1864ab">페업으로 앞으로 툭</text>
    <text x="286" y="186" font-size="11.5" font-weight="700" fill="#1864ab">→ 꺽기 불발·턴오버</text>
    <!-- eye -->
    <path d="M232,150 q10,-8 20,0 q-10,8 -20,0 z" fill="none" stroke="#1864ab" stroke-width="1.5"/><circle cx="242" cy="150" r="2.5" fill="#1864ab"/>
    <text x="196" y="138" font-size="10.5" fill="#1864ab">눈은 상대 포가</text>
    <text x="14" y="262" font-size="11" fill="#495057">반노는 드리블보다 꺽기에서 더 생김 · 늦었으면 직접대쉬</text>
  </g>

  <!-- ③ 일직선 + 바운스 반응 -->
  <g transform="translate(20,350)">
    <rect width="400" height="270" rx="12" fill="#fff" stroke="#dde1e6"/>
    <text x="14" y="26" font-size="15" font-weight="900" fill="#5f3dc4">③ 드리블: 일직선 + 팅 소리에 반 칸</text>
    <use href="#court" x="0" y="30" width="400" height="230"/>
    <line x1="200" y1="100" x2="200" y2="244" stroke="#868e96" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g transform="translate(200,186)"><circle r="16" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#1864ab">수</text></g>
    <g transform="translate(200,244)"><circle r="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#d9480f">슈</text></g>
    <!-- bounce -->
    <circle cx="224" cy="262" r="4" fill="#495057"/><path d="M224,250 q4,6 0,12" stroke="#495057" stroke-width="1.2" fill="none"/>
    <text x="232" y="266" font-size="11" font-weight="900" fill="#d9480f">팅!</text>
    <path d="M200,168 L200,140" stroke="#1971c2" stroke-width="4" marker-end="url(#aB)"/>
    <text x="210" y="150" font-size="11.5" font-weight="700" fill="#1864ab">소리에 반 칸 뒤 → 다시 밀착</text>
    <text x="60" y="120" font-size="10.5" fill="#868e96">골대–슈–나 일직선이면</text>
    <text x="60" y="133" font-size="10.5" fill="#868e96">스핀 단발에 안 풀림</text>
    <rect x="16" y="200" width="150" height="54" rx="6" fill="#f3f0ff"/>
    <text x="24" y="216" font-size="10.5" fill="#5f3dc4">기드 → 밀착 + 질페(툭툭)</text>
    <text x="24" y="230" font-size="10.5" fill="#5f3dc4">백롤2·스핀 단발 → 반 칸</text>
    <text x="24" y="244" font-size="10.5" fill="#5f3dc4">양발 → 공 든 손 쪽으로</text>
    <text x="14" y="262" font-size="11" fill="#495057">상대 미리보기 순서를 읽으면 거리도 미리 정해짐</text>
  </g>

  <!-- ④ 붙고 뛰기 -->
  <g transform="translate(440,350)">
    <rect width="400" height="270" rx="12" fill="#fff" stroke="#dde1e6"/>
    <text x="14" y="26" font-size="15" font-weight="900" fill="#c92a2a">④ 슛: 붙기 → 접게 하기 → 그래도 쏘면 뛰기</text>
    <use href="#court" x="0" y="30" width="400" height="230"/>
    <g transform="translate(270,214)"><circle r="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#d9480f">슈</text><circle cx="0" cy="-26" r="5" fill="#495057"/></g>
    <g transform="translate(150,214)"><circle r="16" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#1864ab">수</text></g>
    <path d="M170,214 L244,214" stroke="#1971c2" stroke-width="5" marker-end="url(#aB)"/>
    <text x="172" y="202" font-size="11.5" font-weight="700" fill="#1864ab">직접대쉬로 붙기</text>
    <path d="M270,186 L270,150" stroke="#c92a2a" stroke-width="3" marker-end="url(#aB)" stroke-dasharray="5 3"/>
    <text x="282" y="160" font-size="11.5" font-weight="700" fill="#c92a2a">멀리서라도 뛰기</text>
    <rect x="16" y="110" width="200" height="66" rx="6" fill="#fff5f5"/>
    <text x="24" y="128" font-size="10.5" fill="#c92a2a">붙으면 3점은 원래 확률의 10~30%</text>
    <text x="24" y="142" font-size="10.5" fill="#c92a2a">갑자기 붙은 슈가는 페이크로 접음</text>
    <text x="24" y="156" font-size="10.5" fill="#c92a2a">안 뛰면 그냥 들어감</text>
    <text x="24" y="170" font-size="10.5" fill="#c92a2a">블락은 보너스, 붙는 게 본체</text>
    <text x="14" y="262" font-size="11" fill="#495057">기습 단발 반노 · 백다운터닝 · 블락 확률은 못 막는 것 → 주고 가는 것</text>
  </g>

  <rect x="20" y="632" width="820" height="22" rx="6" fill="#e7f5ff"/>
  <text x="430" y="647" text-anchor="middle" font-size="12" font-weight="700" fill="#1864ab">길목 먼저 → 패스 순간 밀기 → 일직선 + 팅에 반 칸 → 붙고 뛰기</text>
</svg>
